<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUT_Craft · 轻音日常 (Demo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== 调色板 ===== */
      :root {
        --sky-top: #b8e0ff;
        --sky-mid: #d6edff;
        --sky-bottom: #eaf6ff;

        --card: #fffcf5;
        --card-edge: #7fc0e8;
        --card-edge-soft: #b6dcf0;
        --card-shadow: #8fc7e6;

        --ink: #2a3b4a;
        --ink-soft: #5d7184;
        --ink-faint: #93a4b4;

        --blue: #4aa3e8;
        --blue-deep: #2d7cb8;
        --orange: #ffb866;
        --cream: #fff4dc;

        --online: #5fc28a;
        --online-deep: #3a9e68;
        --offline: #f0a050;
        --offline-deep: #c97a2e;
        --error: #e87878;
        --error-deep: #c44f4f;

        --grass: #a8d89e;
        --grass-deep: #7cb878;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Sans SC", "Zen Maru Gothic", sans-serif;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
        background-attachment: fixed;
        overflow-x: hidden;
        position: relative;
      }

      /* ===== 飘动云朵 ===== */
      .sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .cloud {
        position: absolute;
        background: #ffffff;
        border-radius: 100px;
        filter: drop-shadow(0 6px 0 rgba(120, 170, 210, 0.18));
        opacity: 0.92;
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: #ffffff;
        border-radius: 50%;
      }

      .cloud::before {
        width: 55%;
        height: 140%;
        top: -50%;
        left: 18%;
      }

      .cloud::after {
        width: 40%;
        height: 110%;
        top: -30%;
        right: 14%;
      }

      .cloud.c1 {
        width: 130px;
        height: 38px;
        top: 12%;
        left: -160px;
        animation: drift 48s linear infinite;
      }

      .cloud.c2 {
        width: 90px;
        height: 28px;
        top: 28%;
        left: -120px;
        animation: drift 64s linear infinite;
        animation-delay: -20s;
        opacity: 0.8;
        transform: scale(0.85);
      }

      .cloud.c3 {
        width: 170px;
        height: 46px;
        top: 8%;
        left: -200px;
        animation: drift 80s linear infinite;
        animation-delay: -50s;
        opacity: 0.75;
      }

      .cloud.c4 {
        width: 110px;
        height: 32px;
        top: 40%;
        left: -140px;
        animation: drift 56s linear infinite;
        animation-delay: -12s;
        opacity: 0.7;
      }

      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(100vw + 240px));
        }
      }

      /* ===== 底部草地 + 校舍剪影 ===== */
      .skyline {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
        line-height: 0;
      }

      .skyline svg {
        display: block;
        width: 100%;
        height: auto;
      }

      /* ===== 布局 ===== */
      .layout {
        position: relative;
        z-index: 1;
        width: min(1320px, 92%);
        margin: 0 auto;
        padding: 3rem 0 7rem;
      }

      /* ===== Hero ===== */
      .hero {
        position: relative;
        margin-bottom: 2.4rem;
        animation: rise 600ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }

      .hero-kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: "Klee One", "Zen Maru Gothic", serif;
        font-weight: 600;
        color: var(--blue-deep);
        background: var(--cream);
        border: 2px solid var(--orange);
        border-radius: 999px;
        padding: 0.3rem 0.9rem;
        font-size: 0.9rem;
        box-shadow: 3px 3px 0 var(--orange);
        margin-bottom: 1rem;
      }

      .hero h1 {
        margin: 0;
        font-family: "Zen Maru Gothic", sans-serif;
        font-weight: 900;
        font-size: clamp(1.9rem, 4.6vw, 3.1rem);
        line-height: 1.1;
        color: var(--ink);
        letter-spacing: 0.01em;
      }

      .hero h1 .accent {
        color: var(--blue-deep);
        position: relative;
        display: inline-block;
      }

      .hero h1 .accent::after {
        content: "";
        position: absolute;
        left: 4%;
        right: 4%;
        bottom: 0.1em;
        height: 0.32em;
        background: var(--orange);
        opacity: 0.55;
        border-radius: 999px;
        z-index: -1;
      }

      .hero-subtitle {
        margin: 0.7rem 0 0;
        color: var(--ink-soft);
        max-width: 52ch;
        font-size: 1rem;
        line-height: 1.6;
      }

      .refresh-button {
        margin-top: 1.3rem;
        border: 2.5px solid var(--blue-deep);
        background: var(--blue);
        color: #fff;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        font-family: "Zen Maru Gothic", sans-serif;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 4px 4px 0 var(--blue-deep);
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .refresh-button:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 5px 0 var(--blue-deep);
        background: #57abe9;
      }

      .refresh-button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--blue-deep);
      }

      .refresh-button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
        box-shadow: 4px 4px 0 var(--blue-deep);
      }

      /* ===== 卡片网格 ===== */
      .server-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
        gap: 1.4rem;
      }

      /* ===== 服务器卡片（漂浮便签）===== */
      .server-card {
        position: relative;
        background: var(--card);
        border: 2.5px solid var(--card-edge);
        border-radius: 22px;
        padding: 1.25rem 1.3rem 1.15rem;
        box-shadow: 7px 7px 0 var(--card-shadow);
        transition: transform 160ms ease, box-shadow 160ms ease;
        animation: rise 500ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }

      .server-card:hover {
        transform: translate(-2px, -3px);
        box-shadow: 10px 10px 0 var(--card-shadow);
      }

      .server-card.online {
        border-color: #8fd8ad;
        box-shadow: 7px 7px 0 #b9e6cc;
      }

      .server-card.online:hover {
        box-shadow: 10px 10px 0 #b9e6cc;
      }

      .server-card.offline {
        border-color: #f3c489;
        box-shadow: 7px 7px 0 #f6dcab;
      }

      .server-card.offline:hover {
        box-shadow: 10px 10px 0 #f6dcab;
      }

      .server-card.error {
        border-color: #f0a9a9;
        box-shadow: 7px 7px 0 #f5c7c7;
      }

      .server-card.error:hover {
        box-shadow: 10px 10px 0 #f5c7c7;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        min-width: 0;
      }

      .server-icon {
        width: 2.4rem;
        height: 2.4rem;
        border-radius: 0.7rem;
        border: 2px solid var(--card-edge);
        background: linear-gradient(135deg, #fff4dc, #ffe9bf);
        object-fit: cover;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
      }

      .server-icon.placeholder {
        background: linear-gradient(135deg, #ffe9bf, #ffd692);
      }

      .card-head h2 {
        margin: 0;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: 1.18rem;
        font-weight: 700;
        overflow-wrap: anywhere;
        color: var(--ink);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border-radius: 999px;
        padding: 0.28rem 0.7rem;
        font-size: 0.78rem;
        font-weight: 700;
        font-family: "Zen Maru Gothic", sans-serif;
        border: 2px solid transparent;
        white-space: nowrap;
        flex: 0 0 auto;
      }

      .status-pill .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
      }

      .status-pill.online {
        color: #1f6b43;
        background: #d6f3e2;
        border-color: var(--online);
      }

      .status-pill.online .dot {
        animation: blink 2s ease-in-out infinite;
      }

      .status-pill.offline {
        color: #8a4f17;
        background: #fdebd0;
        border-color: var(--offline);
      }

      .status-pill.error {
        color: #8a2f2f;
        background: #fbdada;
        border-color: var(--error);
      }

      .status-pill.loading {
        color: #1f5275;
        background: #d6ecfb;
        border-color: var(--blue);
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      .data-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.7rem;
        gap: 0.6rem;
        font-size: 0.92rem;
      }

      .label {
        color: var(--ink-soft);
        font-weight: 500;
      }

      .value {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        color: var(--ink);
      }

      .players-row {
        align-items: flex-start;
      }

      .players-row .label {
        padding-top: 0.28rem;
      }

      .players-row .value {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        justify-content: flex-end;
        max-width: 70%;
      }

      .player-chip {
        display: inline-block;
        padding: 0.22rem 0.6rem;
        border: 1.8px solid var(--blue);
        border-radius: 999px;
        background: #e8f4fc;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--blue-deep);
      }

      .player-chip.muted {
        border-color: var(--ink-faint);
        background: #eef2f5;
        color: var(--ink-soft);
        font-family: "Zen Maru Gothic", sans-serif;
      }

      .motd {
        margin: 0.85rem 0 0;
        color: var(--ink);
        font-size: 0.92rem;
        line-height: 1.5;
        min-height: 2.6em;
        padding: 0.6rem 0.8rem;
        background: #fff8ea;
        border-left: 3px solid var(--orange);
        border-radius: 0 10px 10px 0;
      }

      .copy-row {
        margin-top: 0.95rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .address-list {
        display: grid;
        gap: 0.2rem;
        justify-items: start;
        min-width: 0;
      }

      .address-copy {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.32rem 0.7rem;
        border: 2px dashed var(--card-edge);
        border-radius: 999px;
        background: #f1f9fe;
        color: var(--blue-deep);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 120ms ease, border-style 120ms ease;
        overflow-wrap: anywhere;
      }

      .address-copy:hover {
        background: #e1f1fb;
        border-style: solid;
      }

      .address-copy::before {
        content: "📋";
        font-size: 0.85rem;
      }

      .refresh-card-btn {
        flex: 0 0 auto;
        border: 2px solid var(--ink-soft);
        color: var(--ink);
        background: #fff;
        padding: 0.4rem 0.95rem;
        border-radius: 999px;
        font-family: "Zen Maru Gothic", sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--ink-soft);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .refresh-card-btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--ink-soft);
      }

      .refresh-card-btn:active {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0 var(--ink-soft);
      }

      .error-text {
        margin: 0.6rem 0 0;
        color: var(--error-deep);
        font-size: 0.8rem;
        background: #fdecec;
        padding: 0.4rem 0.7rem;
        border-radius: 8px;
      }

      /* ===== 加载骨架 ===== */
      .line {
        height: 12px;
        border-radius: 6px;
        margin-top: 0.8rem;
        background: #e8eef3;
      }

      .line.short {
        width: 65%;
      }

      .shimmer {
        background: linear-gradient(90deg, #e8eef3, #f7fafc, #e8eef3);
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
      }

      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -100% 0;
        }
      }

      /* ===== 页脚 ===== */
      .site-footer {
        position: relative;
        z-index: 1;
        margin-top: 2.5rem;
        padding: 1rem 1.4rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.7);
        border: 2px solid #cfe6f5;
        color: var(--ink-soft);
        font-size: 0.88rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5rem;
        backdrop-filter: blur(6px);
      }

      .api-link {
        color: var(--blue-deep);
        font-family: "JetBrains Mono", monospace;
        text-decoration: none;
        overflow-wrap: anywhere;
        font-weight: 700;
      }

      .api-link:hover {
        text-decoration: underline;
      }

      /* ===== Toast ===== */
      .toast {
        position: fixed;
        right: 1.2rem;
        bottom: 1.2rem;
        padding: 0.7rem 1.1rem;
        border-radius: 14px;
        border: 2px solid var(--blue-deep);
        background: var(--card);
        color: var(--ink);
        font-family: "Zen Maru Gothic", sans-serif;
        font-weight: 700;
        box-shadow: 4px 4px 0 var(--blue-deep);
        z-index: 20;
        transition: opacity 250ms ease, transform 250ms ease;
      }

      .toast-out {
        opacity: 0;
        transform: translateY(10px);
      }

      /* ===== 动画 ===== */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .server-card:nth-child(1) {
        animation-delay: 60ms;
      }
      .server-card:nth-child(2) {
        animation-delay: 130ms;
      }
      .server-card:nth-child(3) {
        animation-delay: 200ms;
      }
      .server-card:nth-child(4) {
        animation-delay: 270ms;
      }
      .server-card:nth-child(5) {
        animation-delay: 340ms;
      }

      /* ===== 响应式 ===== */
      @media (max-width: 720px) {
        .layout {
          padding: 2rem 0 6rem;
        }

        .server-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }

        .card-head {
          flex-direction: column;
          align-items: flex-start;
        }

        .copy-row {
          flex-direction: column;
          align-items: stretch;
        }

        .players-row .value {
          max-width: 100%;
          justify-content: flex-start;
        }

        .server-card {
          box-shadow: 5px 5px 0 var(--card-shadow);
        }

        .server-card.online {
          box-shadow: 5px 5px 0 #b9e6cc;
        }

        .server-card.offline {
          box-shadow: 5px 5px 0 #f6dcab;
        }

        .server-card.error {
          box-shadow: 5px 5px 0 #f5c7c7;
        }
      }
    </style>
  </head>
  <body>
    <!-- 飘动云朵 -->
    <div class="sky" aria-hidden="true">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="cloud c4"></div>
    </div>

    <!-- 底部草地 + 校舍剪影 -->
    <div class="skyline" aria-hidden="true">
      <svg viewBox="0 0 1440 220" preserveAspectRatio="xMidYMax slice">
        <!-- 远处建筑剪影 -->
        <g fill="#b9d4ea" opacity="0.6">
          <rect x="80" y="120" width="70" height="60" />
          <rect x="150" y="100" width="50" height="80" />
          <polygon points="150,100 175,80 200,100" />
          <rect x="220" y="110" width="90" height="70" />
          <rect x="1100" y="115" width="80" height="65" />
          <rect x="1180" y="95" width="60" height="85" />
          <polygon points="1180,95 1210,72 1240,95" />
          <rect x="1240" y="110" width="70" height="70" />
        </g>
        <!-- 近处校舍 -->
        <g fill="#9bc0db" opacity="0.85">
          <rect x="360" y="95" width="160" height="85" />
          <rect x="900" y="100" width="140" height="80" />
        </g>
        <!-- 窗户 -->
        <g fill="#7fb3d6">
          <rect x="380" y="110" width="18" height="18" />
          <rect x="410" y="110" width="18" height="18" />
          <rect x="440" y="110" width="18" height="18" />
          <rect x="470" y="110" width="18" height="18" />
          <rect x="380" y="140" width="18" height="18" />
          <rect x="410" y="140" width="18" height="18" />
          <rect x="440" y="140" width="18" height="18" />
          <rect x="470" y="140" width="18" height="18" />
          <rect x="920" y="115" width="18" height="18" />
          <rect x="950" y="115" width="18" height="18" />
          <rect x="980" y="115" width="18" height="18" />
          <rect x="1010" y="115" width="18" height="18" />
        </g>
        <!-- 草地 -->
        <path d="M0,150 Q360,135 720,150 T1440,150 L1440,220 L0,220 Z" fill="var(--grass)" />
        <path d="M0,170 Q360,158 720,170 T1440,170 L1440,220 L0,220 Z" fill="var(--grass-deep)" opacity="0.8" />
        <!-- 小花/草丛点缀 -->
        <g fill="#ffffff" opacity="0.85">
          <circle cx="120" cy="185" r="3" />
          <circle cx="300" cy="178" r="3" />
          <circle cx="540" cy="188" r="3" />
          <circle cx="760" cy="180" r="3" />
          <circle cx="980" cy="186" r="3" />
          <circle cx="1200" cy="178" r="3" />
          <circle cx="1360" cy="184" r="3" />
        </g>
      </svg>
    </div>

    <main class="layout">
      <header class="hero">
        <span class="hero-kicker">☀️ 今日もいいお天気</span>
        <h1>DUT_Craft <span class="accent">服务器状态</span></h1>
        <p class="hero-subtitle">实时查询预设服务器的在线状态、人数、MOTD 与版本信息。点开看看小伙伴们在不在线吧～</p>
        <button id="refresh-all" class="refresh-button" type="button">🔄 刷新全部服务器</button>
      </header>

      <section>
        <div id="status-board" class="server-grid" aria-live="polite"></div>
      </section>

      <footer class="site-footer">
        <div>
          <span>API：</span>
          <a class="api-link" href="https://api.mcsrvstat.us/2" target="_blank" rel="noreferrer noopener">
            https://api.mcsrvstat.us/2
          </a>
        </div>
        <div>☁️ 查询状态会缓存 2 分钟，可能不是最新数据！</div>
      </footer>
    </main>

    <script>
      // ===== Mock 数据（演示各种状态）=====
      const mockServers = [
        {
          id: "lobby",
          name: "DUT_Craft 大厅",
          emoji: "🏡",
          status: "online",
          playersText: "12 / 100",
          version: "1.20.4",
          playerNames: ["Steve", "Alex", "Notch", "Diana"],
          anonymousPlayerCount: 8,
          motdHtml: "§6欢迎来到 §bDUT_Craft§6！请遵守服务器规则，愉快游玩～",
          addresses: ["lobby.unsafe.top:25565"],
        },
        {
          id: "survival",
          name: "DUT_Craft 生存服",
          emoji: "⛏️",
          status: "online",
          playersText: "3 / 60",
          version: "1.20.4",
          playerNames: [],
          anonymousPlayerCount: 0,
          motdHtml: "§a原版生存 · 经济系统 · 领地保护",
          addresses: ["survival.unsafe.top:25565"],
        },
        {
          id: "creative",
          name: "DUT_Craft 创造服",
          emoji: "🎨",
          status: "offline",
          playersText: "—",
          version: "—",
          playerNames: [],
          anonymousPlayerCount: 0,
          motdHtml: "创造模式 · 自由建造",
          addresses: ["creative.unsafe.top:25565"],
        },
        {
          id: "test",
          name: "DUT_Craft 测试服",
          emoji: "🧪",
          status: "error",
          errorText: "连接超时，请稍后重试",
          playersText: "—",
          version: "—",
          playerNames: [],
          anonymousPlayerCount: 0,
          motdHtml: "测试新玩法与插件",
          addresses: ["test.unsafe.top:25565", "test2.unsafe.top:25566"],
        },
        {
          id: "minigame",
          name: "DUT_Craft 小游戏服",
          emoji: "🎮",
          status: "online",
          playersText: "27 / 50",
          version: "Paper 1.20.4",
          playerNames: ["Miku", "Ritsu", "Yui", "Mio", "Tsumugi"],
          anonymousPlayerCount: 22,
          motdHtml: "§d起床战争 §e· §b空岛战争 §e· §a掘一动二",
          addresses: ["game.unsafe.top"],
        },
      ];

      // 简易 §颜色码 -> span 渲染（仅 demo）
      const mcColors = {
        "0": "#000000",
        "1": "#0000AA",
        "2": "#00AA00",
        "3": "#00AAAA",
        "4": "#AA0000",
        "5": "#AA00AA",
        "6": "#FFAA00",
        "7": "#AAAAAA",
        "8": "#555555",
        "9": "#5555FF",
        a: "#FF55FF",
        b: "#55FFFF",
        c: "#FF5555",
        d: "#FF55FF",
        e: "#FFFF55",
        f: "#FFFFFF",
      };

      function renderMotd(text) {
        if (!text) return "";
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/§([0-9a-f])/gi, (_, c) => {
            const color = mcColors[c.toLowerCase()] || "inherit";
            return `</span><span style="color:${color}">`;
          })
          .replace(/^([^<]*)/, (m) => `<span>${m}`)
          .replace(/$/, "</span>");
      }

      function statusLabel(status) {
        return { online: "在线", offline: "离线", error: "错误", loading: "加载中" }[status] || "未知";
      }

      function playerChips(s) {
        if (s.status !== "online") return '<span class="player-chip muted">无</span>';
        if (s.playerNames.length === 0 && s.anonymousPlayerCount === 0)
          return '<span class="player-chip muted">暂无在线玩家</span>';
        const named = s.playerNames.map((n) => `<span class="player-chip">${n}</span>`).join("");
        const anon =
          s.anonymousPlayerCount > 0
            ? `<span class="player-chip muted">匿名玩家 ×${s.anonymousPlayerCount}</span>`
            : "";
        return named + anon;
      }

      function addressMarkup(addrs) {
        return addrs
          .map(
            (a) =>
              `<button class="address-copy" type="button" data-copy="${a}" aria-label="复制 ${a}">${a}</button>`
          )
          .join("");
      }

      function cardHtml(s) {
        if (s.status === "loading") {
          return `
            <header class="card-head">
              <div class="title-wrap">
                <span class="server-icon placeholder">${s.emoji || "📦"}</span>
                <h2>${s.name}</h2>
              </div>
              <span class="status-pill loading"><span class="dot"></span>加载中</span>
            </header>
            <p class="address">${s.addresses ? s.addresses.join("<br>") : ""}</p>
            <div class="line shimmer"></div>
            <div class="line shimmer short"></div>`;
        }
        return `
          <header class="card-head">
            <div class="title-wrap">
              <span class="server-icon">${s.emoji || "📦"}</span>
              <h2>${s.name}</h2>
            </div>
            <span class="status-pill ${s.status}"><span class="dot"></span>${statusLabel(s.status)}</span>
          </header>
          <div class="data-row"><span class="label">在线人数</span><span class="value">${s.playersText}</span></div>
          <div class="data-row"><span class="label">版本</span><span class="value">${s.version}</span></div>
          <div class="data-row players-row"><span class="label">在线玩家</span><span class="value">${playerChips(s)}</span></div>
          <div class="motd">${renderMotd(s.motdHtml)}</div>
          <div class="copy-row">
            <div class="address-list">${addressMarkup(s.addresses)}</div>
            <button class="refresh-card-btn" type="button">↻ 刷新</button>
          </div>
          ${s.errorText ? `<p class="error-text">⚠️ ${s.errorText}</p>` : ""}`;
      }

      const board = document.getElementById("status-board");

      function render(list) {
        board.innerHTML = "";
        list.forEach((s) => {
          const card = document.createElement("article");
          card.className = `server-card ${s.status}`;
          card.dataset.id = s.id;
          card.innerHTML = cardHtml(s);
          board.appendChild(card);
        });
        bindCopy();
      }

      function bindCopy() {
        document.querySelectorAll(".address-copy").forEach((btn) => {
          btn.onclick = () => toast(`已复制：${btn.dataset.copy}`);
        });
      }

      function toast(msg) {
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => {
          t.classList.add("toast-out");
          setTimeout(() => t.remove(), 250);
        }, 1500);
      }

      // 初次：先加载骨架，再展示数据（演示加载态）
      function loadingView() {
        return mockServers.map((s) => ({ ...s, status: "loading" }));
      }

      const refreshBtn = document.getElementById("refresh-all");
      refreshBtn.addEventListener("click", () => {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "🔄 刷新中...";
        render(loadingView());
        setTimeout(() => {
          render(mockServers);
          refreshBtn.disabled = false;
          refreshBtn.textContent = "🔄 刷新全部服务器";
          toast("刷新完成 ☁️");
        }, 900);
      });

      board.addEventListener("click", (e) => {
        const btn = e.target.closest(".refresh-card-btn");
        if (!btn) return;
        const card = btn.closest(".server-card");
        const id = card?.dataset.id;
        const target = mockServers.find((s) => s.id === id);
        if (!target) return;
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = "刷新中...";
        card.classList.remove(target.status);
        card.classList.add("loading");
        card.innerHTML = cardHtml({ ...target, status: "loading" });
        setTimeout(() => {
          card.classList.remove("loading");
          card.classList.add(target.status);
          card.innerHTML = cardHtml(target);
          bindCopy();
          btn.disabled = false;
          btn.textContent = original;
        }, 700);
      });

      // 启动
      render(loadingView());
      setTimeout(() => render(mockServers), 1100);
    </script>
  </body>
</html>
