<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUT_Craft 服务器状态查询</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 防 FOUC：在样式应用前根据存储/系统偏好锁定主题 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dutcraft-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <!-- 背景动画舞台：dark 与 light 两套对照层，由 CSS 按主题显隐 -->
    <div class="bg-stage" aria-hidden="true">
      <!-- 月夜星咏（dark）-->
      <div class="stars"></div>
      <div class="stars-mid"></div>
      <div class="stars-far"></div>
      <div class="moon"></div>
      <div class="meteor m1"></div>
      <div class="meteor m2"></div>
      <div class="meteor m3"></div>
      <!-- 琉璃晨光（light）-->
      <div class="grid-lines"></div>
      <div class="haze-blob b1"></div>
      <div class="haze-blob b2"></div>
      <div class="haze-blob b3"></div>
      <div class="sunbeam-streak s1"></div>
      <div class="sunbeam-streak s2"></div>
      <div class="sunbeam-streak s3"></div>
    </div>

    <main class="layout">
      <header class="hero">
        <div class="hero-top">
          <span class="hero-kicker" id="hero-kicker">Lunar Nocturne</span>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
            <span class="icon-moon" aria-hidden="true">🌙</span>
            <span class="icon-sun" aria-hidden="true">☀️</span>
          </button>
        </div>
        <h1><span class="zh" id="hero-title-zh">月夜星咏 · </span><span class="accent">服务器状态</span></h1>
        <p class="hero-subtitle" id="hero-subtitle">于静谧夜空下，守望每一座服务器的微光。实时查询预设服务器的在线状态、人数、MOTD 与版本信息。</p>
        <button id="refresh-all" class="refresh-button" type="button" aria-label="刷新所有服务器状态">
          刷新全部服务器
        </button>
      </header>

      <section>
        <div id="status-board" class="server-grid" aria-live="polite"></div>
      </section>

      <footer class="site-footer">
        <div>
          <span>API：</span>
          <a class="api-link" href="https://api.mcsrvstat.us/2" target="_blank" rel="noreferrer noopener">
            https://api.mcsrvstat.us/2
          </a>
        </div>
        <div>查询状态会缓存 2 分钟，可能不是最新数据</div>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
